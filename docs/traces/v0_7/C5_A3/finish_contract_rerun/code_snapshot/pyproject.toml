[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-adaptive-mas"
version = "0.6.0"
description = "Research harness for adaptive organization in ARE/Gaia2"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "typing_extensions>=4", "pydantic>=2.10,<3"]

[project.optional-dependencies]
are = ["meta-agents-research-environments==1.2.0", "litellm==1.71.1"]
model = ["litellm==1.71.1"]
data = ["pyarrow==26.0.0", "huggingface-hub>=0.33,<1"]
dev = ["pytest>=8,<10", "ruff==0.16.9", "pre-commit>=4.2,<5"]

[project.scripts]
security-mas = "security_adaptive_mas.cli.main:main"

[tool.setuptools.packages.find]
include = ["security_adaptive_mas*"]

[tool.setuptools.package-data]
security_adaptive_mas = ["_vendor/**/LICENSE", "_vendor/**/originals/**/*.txt", "_vendor/**/modifications/**/*.diff"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E9", "F"]
