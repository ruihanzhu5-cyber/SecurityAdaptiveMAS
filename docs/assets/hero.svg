<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SecurityAdaptiveMAS 研究原型</title>
  <desc id="desc">浅色示意图：紫色控制器调整蓝色智能体之间的连接，橙色安全检查限制有风险的支路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 380 H1200" stroke="#CBD5E1" stroke-width="1" opacity=".7"/>
  <path d="M48 0 V420 M288 0 V420 M528 0 V420 M768 0 V420 M1008 0 V420" stroke="#CBD5E1" stroke-width="1" opacity=".18"/>
  <rect x="60" y="52" width="210" height="30" rx="15" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
  <text x="165" y="72" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">研究原型</text>
  <text x="60" y="160" fill="#0F172A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">SecurityAdaptiveMAS</text>
  <rect x="60" y="183" width="540" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="226" fill="#334155" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23">面向长任务的安全协作</text>
  <text x="60" y="258" fill="#334155" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23">根据任务变化调整团队</text>
  <text x="60" y="322" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">灵活分工，同时管住消息和工具权限。</text>
  <text x="60" y="400" fill="#64748B" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" letter-spacing="1.8">GAIA2 / ARE  ·  MANTA 团队结构  ·  DEEPSEEK</text>

  <!-- Conceptual agent organization; this artwork is not an execution trace. -->
  <path d="M842 111 L960 180 M1102 111 L1030 177 M1042 236 L1110 306 M955 238 L834 307" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M847 315 Q970 366 1106 316" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 8" opacity=".9"/>
  <path d="M1107 110 Q1168 195 1113 303" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 7" opacity=".9"/>
  <rect x="899" y="154" width="166" height="96" rx="25" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="982" cy="185" r="11" fill="#7C3AED"/>
  <text x="982" y="222" text-anchor="middle" fill="#5B21B6" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">控制器</text>
  <g fill="#E7F8FB" stroke="#0891B2" stroke-width="2">
    <rect x="777" y="79" width="122" height="62" rx="22"/>
    <rect x="1051" y="79" width="122" height="62" rx="22"/>
    <rect x="777" y="291" width="122" height="62" rx="22"/>
    <rect x="1051" y="291" width="122" height="62" rx="22"/>
  </g>
  <g fill="#155E75" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="838" y="118">协调员</text><text x="1112" y="118">工作者 A</text>
    <text x="838" y="330">工作者 B</text><text x="1112" y="330">验证员</text>
  </g>
  <path d="M1137 182 L1155 190 L1155 210 Q1155 226 1137 234 Q1119 226 1119 210 L1119 190 Z" fill="#FFF4D8" stroke="#D97706" stroke-width="2"/>
  <path d="M1129 208 L1135 214 L1146 201" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1137" y="260" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700">安全检查</text>
</svg>
