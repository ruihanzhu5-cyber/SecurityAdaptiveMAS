<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">团队分工中的信息风险示意</title>
  <desc id="desc">左侧展示外部内容可能沿工作者、共享摘要传到执行者。右侧展示控制器限制路线和可见内容，隔离风险支路，并安排验证。这是设计示意，不是实测对比。</desc>
  <defs>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#F8FAFC"/>
  <text x="52" y="65" fill="#0F172A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700">为什么分工时还要管信息？</text>
  <text x="52" y="93" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16">设计示意：增加人员和连接时，也要检查信息会传到哪里</text>

  <rect x="42" y="122" width="542" height="371" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="616" y="122" width="542" height="371" rx="22" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="78" cy="166" r="10" fill="#0891B2"/>
  <text x="100" y="174" fill="#1E293B" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">只增加分工</text>
  <circle cx="652" cy="166" r="10" fill="#7C3AED"/>
  <text x="674" y="174" fill="#5B21B6" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">分工时检查风险</text>
  <text x="74" y="205" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17">更多工作者可以同时处理任务。</text>
  <text x="648" y="205" fill="#6D28D9" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17">检查消息路线和可见内容。</text>

  <!-- Left: an unchecked propagation path, not a benchmark result. -->
  <g fill="#E7F8FB" stroke="#0891B2" stroke-width="2">
    <rect x="93" y="244" width="112" height="63" rx="16"/>
    <rect x="233" y="244" width="112" height="63" rx="16"/>
    <rect x="373" y="244" width="112" height="63" rx="16"/>
  </g>
  <g fill="#155E75" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">
    <text x="149" y="283">智能体 1</text><text x="289" y="283">智能体 2</text><text x="429" y="283">智能体 3</text>
  </g>
  <path d="M207 276 H224 M347 276 H364" stroke="#0891B2" stroke-width="2.5" marker-end="url(#cyanArrow)"/>
  <text x="74" y="354" fill="#D97706" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" letter-spacing="1">外部内容可能一路传播</text>
  <g fill="#FFF4D8" stroke="#D97706" stroke-width="1.6">
    <rect x="72" y="378" width="110" height="66" rx="13"/>
    <rect x="201" y="378" width="100" height="66" rx="13"/>
    <rect x="320" y="378" width="104" height="66" rx="13"/>
    <rect x="443" y="378" width="112" height="66" rx="13"/>
  </g>
  <g fill="#92400E" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700">
    <text x="127" y="404">外部</text><text x="127" y="424">内容</text>
    <text x="251" y="414">工作者</text>
    <text x="372" y="404">共享</text><text x="372" y="424">摘要</text>
    <text x="499" y="404">有权限的</text><text x="499" y="424">执行者</text>
  </g>
  <path d="M185 411 H195 M304 411 H314 M427 411 H437" stroke="#D97706" stroke-width="2.6" marker-end="url(#amberArrow)"/>

  <!-- Right: desired controls, with honest target labels. -->
  <rect x="792" y="233" width="190" height="76" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="887" y="264" fill="#5B21B6" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">团队</text>
  <text x="887" y="289" fill="#5B21B6" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">控制器</text>
  <rect x="646" y="245" width="115" height="54" rx="15" fill="#E7F8FB" stroke="#0891B2" stroke-width="2"/>
  <text x="703" y="278" fill="#155E75" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">任务</text>
  <rect x="1014" y="245" width="115" height="54" rx="15" fill="#E7F8FB" stroke="#0891B2" stroke-width="2"/>
  <text x="1071" y="278" fill="#155E75" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">工作者</text>
  <path d="M763 272 H784 M984 272 H1005" stroke="#0891B2" stroke-width="2.7" marker-end="url(#cyanArrow)"/>
  <rect x="648" y="371" width="130" height="65" rx="14" fill="#FFF4D8" stroke="#D97706" stroke-width="2"/>
  <text x="713" y="396" fill="#92400E" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">风险支路</text>
  <text x="713" y="417" fill="#92400E" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">隔离并检查</text>
  <path d="M783 404 H843" stroke="#D97706" stroke-width="2.6" stroke-dasharray="6 6"/>
  <path d="M849 394 L867 414 M867 394 L849 414" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
  <rect x="926" y="371" width="204" height="65" rx="14" fill="#E7F8FB" stroke="#0891B2" stroke-width="2"/>
  <text x="1028" y="396" fill="#155E75" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700">获准的信息</text>
  <text x="1028" y="418" fill="#155E75" text-anchor="middle" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">→ 验证员</text>
  <path d="M887 313 V350 H1028 V363" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#cyanArrow)"/>
  <text x="600" y="529" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17">研究问题：团队能否随任务调整，同时守住信息和工具的使用边界？</text>
</svg>
