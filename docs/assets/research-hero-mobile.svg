<svg xmlns="http://www.w3.org/2000/svg" width="480" height="555" viewBox="0 0 480 555" role="img" aria-labelledby="title desc">
  <title id="title">移动端研究主线：任务、协作、历史风险、Controller</title>
  <desc id="desc">四个概念按纵向排列，当前研究处于系统建模阶段，尚未实现完整闭环。</desc>
  <rect x="1" y="1" width="478" height="553" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="22" y="39" fill="#4338CA" font-size="15" font-weight="700">RESEARCH NOTEBOOK · 2026-10-12</text>
    <text x="21" y="77" fill="#0F172A" font-size="29" font-weight="700">任务驱动的拓扑自适应</text>
    <text x="22" y="104" fill="#475569" font-size="17">当前：系统建模 · 概念尚待验证</text>

    <path d="M 240 204 L 240 219 M 240 310 L 240 325 M 240 416 L 240 431" stroke="#64748B" stroke-width="2.5"/>
    <path d="M 235 214 L 240 221 L 245 214 M 235 320 L 240 327 L 245 320 M 235 426 L 240 433 L 245 426" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="21" y="126" width="438" height="79" rx="11" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="21" y="126" width="7" height="79" rx="3" fill="#4F46E5"/>
    <text x="45" y="156" fill="#4338CA" font-size="15" font-weight="700">01 TASK</text>
    <text x="163" y="158" fill="#0F172A" font-size="22" font-weight="700">任务需求</text>
    <text x="45" y="187" fill="#475569" font-size="16">依赖、并行机会、信息需求</text>

    <rect x="21" y="232" width="438" height="79" rx="11" fill="#FFFFFF" stroke="#99DED4" stroke-width="1.5"/>
    <rect x="21" y="232" width="7" height="79" rx="3" fill="#0F766E"/>
    <text x="45" y="262" fill="#0F766E" font-size="15" font-weight="700">02 ORGANIZATION</text>
    <text x="210" y="264" fill="#0F172A" font-size="22" font-weight="700">协作结构</text>
    <text x="45" y="293" fill="#475569" font-size="16">角色、消息、Memory 和工具关系</text>

    <rect x="21" y="338" width="438" height="79" rx="11" fill="#FFFFFF" stroke="#F3C087" stroke-width="1.5"/>
    <rect x="21" y="338" width="7" height="79" rx="3" fill="#D97706"/>
    <text x="45" y="368" fill="#9A3412" font-size="15" font-weight="700">03 TEMPORAL RISK</text>
    <text x="210" y="370" fill="#0F172A" font-size="22" font-weight="700">历史风险</text>
    <text x="45" y="399" fill="#475569" font-size="16">旧输入能否经新路径接近敏感能力</text>

    <rect x="21" y="444" width="438" height="79" rx="11" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="21" y="444" width="7" height="79" rx="3" fill="#4338CA"/>
    <text x="45" y="474" fill="#4338CA" font-size="15" font-weight="700">04 CONTROLLER</text>
    <text x="210" y="476" fill="#0F172A" font-size="22" font-weight="700">联合选择</text>
    <text x="45" y="505" fill="#475569" font-size="16">比较任务收益、风险和重组成本</text>
    <text x="22" y="543" fill="#64748B" font-size="13">概念模型，不代表已实现或验证完整闭环。</text>
  </g>
</svg>
