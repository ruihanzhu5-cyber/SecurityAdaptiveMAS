<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">任务驱动的拓扑自适应与时间性安全约束</title>
  <desc id="desc">研究主线为任务需求、协作结构、历史风险与联合控制器。当前处于系统建模阶段，图示不是已实现系统。</desc>
  <rect x="1" y="1" width="958" height="368" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
    <rect x="28" y="25" width="184" height="29" rx="14" fill="#E0E7FF"/>
    <text x="44" y="45" fill="#3730A3" font-size="14" font-weight="700" letter-spacing="1">RESEARCH NOTEBOOK</text>
    <text x="29" y="99" fill="#0F172A" font-size="37" font-weight="700">任务驱动的拓扑自适应</text>
    <text x="31" y="130" fill="#475569" font-size="17">在长程任务中连接协作收益、历史信息和可执行的安全边界</text>
    <rect x="715" y="43" width="216" height="49" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="734" cy="67" r="6" fill="#D97706"/>
    <text x="751" y="73" fill="#334155" font-size="15" font-weight="600">当前：系统建模</text>

    <path d="M 243 244 L 258 244 M 473 244 L 488 244 M 703 244 L 718 244" fill="none" stroke="#64748B" stroke-width="2.5"/>
    <path d="M 257 239 L 264 244 L 257 249 M 487 239 L 494 244 L 487 249 M 717 239 L 724 244 L 717 249" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="28" y="165" width="216" height="158" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="28" y="165" width="216" height="6" rx="3" fill="#4F46E5"/>
    <text x="45" y="199" fill="#4338CA" font-size="13" font-weight="700">01 · TASK</text>
    <text x="45" y="234" fill="#0F172A" font-size="23" font-weight="700">任务需求</text>
    <text x="45" y="264" fill="#475569" font-size="16">依赖、并行机会</text>
    <text x="45" y="289" fill="#475569" font-size="16">和信息需求</text>

    <rect x="258" y="165" width="216" height="158" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="258" y="165" width="216" height="6" rx="3" fill="#0F766E"/>
    <text x="275" y="199" fill="#0F766E" font-size="13" font-weight="700">02 · ORGANIZATION</text>
    <text x="275" y="234" fill="#0F172A" font-size="23" font-weight="700">协作结构</text>
    <text x="275" y="264" fill="#475569" font-size="16">角色、消息、Memory</text>
    <text x="275" y="289" fill="#475569" font-size="16">及工具关系</text>

    <rect x="488" y="165" width="216" height="158" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="488" y="165" width="216" height="6" rx="3" fill="#D97706"/>
    <text x="505" y="199" fill="#9A3412" font-size="13" font-weight="700">03 · TEMPORAL RISK</text>
    <text x="505" y="234" fill="#0F172A" font-size="23" font-weight="700">历史风险</text>
    <text x="505" y="264" fill="#475569" font-size="16">旧输入能否经新路径</text>
    <text x="505" y="289" fill="#475569" font-size="16">接近敏感能力</text>

    <rect x="718" y="165" width="214" height="158" rx="13" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="718" y="165" width="214" height="6" rx="3" fill="#4338CA"/>
    <text x="735" y="199" fill="#4338CA" font-size="13" font-weight="700">04 · CONTROLLER</text>
    <text x="735" y="234" fill="#0F172A" font-size="23" font-weight="700">联合选择</text>
    <text x="735" y="264" fill="#475569" font-size="16">比较任务、风险</text>
    <text x="735" y="289" fill="#475569" font-size="16">与重组成本</text>

    <text x="31" y="349" fill="#64748B" font-size="13">概念模型 · 尚未实现或验证完整闭环</text>
    <text x="744" y="349" fill="#64748B" font-size="13">UPDATED 2026-10-12</text>
  </g>
</svg>
