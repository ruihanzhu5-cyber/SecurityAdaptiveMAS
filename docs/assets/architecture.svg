    <text x="720" y="269">结构</text><text x="720" y="294">规划</text>
    <text x="940" y="269">团队</text><text x="940" y="294">选择</text>
    <text x="880" y="378">调整团队与权限</text>
    <text x="880" y="402" fill="#6D28D9" font-size="15" font-weight="400">成员 · 路线 · 可见内容 · 隔离</text>
  </g>
  <text x="550" y="378" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">来源记录 + 简单规则</text>
  <text x="550" y="402" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">可见输入 · 外部内容标记</text>
  <rect x="395" y="450" width="325" height="74" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="557" y="479" text-anchor="middle" fill="#1E293B" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700">MANTA 团队结构</text>
  <text x="557" y="503" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">结构 · 可见内容 · 调整</text>
  <rect x="740" y="450" width="295" height="74" rx="15" fill="#FFF4D8" stroke="#D97706" stroke-width="1.7"/>
  <text x="887" y="480" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">消息网关</text>
  <text x="887" y="503" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">路线 · 版本 · 隔离</text>
  <rect x="395" y="550" width="325" height="74" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="557" y="580" text-anchor="middle" fill="#1E293B" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">控制器状态</text>
  <text x="557" y="603" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">版本 · 权限 · 阶段</text>
  <rect x="740" y="550" width="295" height="74" rx="15" fill="#FFF4D8" stroke="#D97706" stroke-width="1.7"/>
  <text x="887" y="580" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">工具网关</text>
  <text x="887" y="603" text-anchor="middle" fill="#92400E" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">角色 · 资源 · 明确的写授权</text>
  <text x="700" y="657" text-anchor="middle" fill="#6D28D9" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">选择团队时估计任务收益、成本和有限的风险信号。</text>

  <g fill="#E7F8FB" stroke="#0891B2" stroke-width="1.8">
    <rect x="1125" y="235" width="240" height="70" rx="15"/>
    <rect x="1125" y="335" width="240" height="70" rx="15"/>
    <rect x="1125" y="435" width="240" height="70" rx="15"/>
    <rect x="1125" y="535" width="240" height="70" rx="15"/>
  </g>
  <g fill="#155E75" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="1245" y="278">协调员</text>
    <text x="1245" y="378">工作者 A · 只读</text>
    <text x="1245" y="478">工作者 B · 只读</text>
    <text x="1245" y="578">验证员</text>
  </g>
  <text x="1245" y="647" text-anchor="middle" fill="#0E7490" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">多角色路径：等待在线验证</text>

