<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">SecurityAdaptiveMAS 框架</title>
  <desc id="desc">三栏依次展示 Gaia2/ARE 任务环境、控制器及网关、DeepSeek 驱动的协调员与工作者。多智能体路径已有原型，尚未在线验证。</desc>
  <defs>
    <marker id="violetArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="800" rx="22" fill="#F8FAFC"/>
  <text x="50" y="63" fill="#0F172A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700">系统怎样工作</text>
  <text x="50" y="95" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17">任务来自 ARE；控制器安排分工并检查权限；模型处理获准的只读任务</text>

  <rect x="45" y="130" width="290" height="555" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="365" y="130" width="700" height="555" rx="22" fill="#F7F4FF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="1095" y="130" width="300" height="555" rx="22" fill="#F0FBFD" stroke="#0891B2" stroke-width="2"/>
  <text x="75" y="175" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 · 任务环境</text>
  <text x="75" y="209" fill="#0F172A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">Gaia2 / ARE</text>
  <text x="395" y="175" fill="#6D28D9" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 · 团队控制</text>
  <text x="395" y="209" fill="#5B21B6" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">分工与权限控制</text>
  <text x="1125" y="175" fill="#0E7490" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 · 任务执行</text>
  <text x="1125" y="209" fill="#155E75" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">DeepSeek 驱动的角色</text>

  <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.5">
    <rect x="75" y="235" width="230" height="70" rx="15"/>
    <rect x="75" y="335" width="230" height="70" rx="15"/>
    <rect x="75" y="435" width="230" height="70" rx="15"/>
    <rect x="75" y="535" width="230" height="70" rx="15"/>
  </g>
  <g fill="#1E293B" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="190" y="278">五个固定场景</text>
    <text x="190" y="378">模拟应用与工具</text>
    <text x="190" y="478">任务中的事件</text>
    <text x="190" y="578">官方任务验证器</text>
  </g>
  <text x="190" y="647" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">ScenarioRunner · AgentBuilder</text>

  <g fill="#F1EBFF" stroke="#7C3AED" stroke-width="1.7">
    <rect x="395" y="235" width="200" height="78" rx="15"/>
    <rect x="620" y="235" width="200" height="78" rx="15"/>
    <rect x="845" y="235" width="190" height="78" rx="15"/>
    <rect x="725" y="345" width="310" height="78" rx="15"/>
