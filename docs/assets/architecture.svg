  <path d="M1065 271 H1087" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#violetArrow)"/>
  <path d="M599 274 H613 M824 274 H838" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#violetArrow)"/>
  <path d="M940 316 V335" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#violetArrow)"/>
  <path d="M1095 487 H1043" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#amberArrow)"/>
  <path d="M1095 587 H1043" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#amberArrow)"/>
  <path d="M887 624 V711 H190 V692" fill="none" stroke="#22D3EE" stroke-width="2.4" marker-end="url(#cyanArrow)"/>
  <text x="533" y="737" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="15">Authorized ARE read-tool execution</text>

