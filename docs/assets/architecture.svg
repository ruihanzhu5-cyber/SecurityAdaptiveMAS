<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">SecurityAdaptiveMAS architecture</title>
  <desc id="desc">Three columns show the Gaia2 ARE environment, a security-aware organization controller with MANTA topology structures and gateways, and a DeepSeek-powered coordinator, workers, and verifier. The multi-agent path is implemented as a prototype but not online validated.</desc>
  <defs>
    <marker id="violetArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="800" rx="22" fill="#0F172A"/>
  <text x="50" y="63" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">System architecture</text>
  <text x="50" y="95" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">A narrow ARE bridge, a deterministic control layer, and model-driven read-only agent roles</text>

  <rect x="45" y="130" width="290" height="555" rx="22" fill="#172338" stroke="#475569" stroke-width="2"/>
  <rect x="365" y="130" width="700" height="555" rx="22" fill="#1A2240" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="1095" y="130" width="300" height="555" rx="22" fill="#12303E" stroke="#06B6D4" stroke-width="2"/>
  <text x="75" y="175" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 · ENVIRONMENT</text>
  <text x="75" y="209" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Gaia2 / ARE</text>
  <text x="395" y="175" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 · CONTROL PLANE</text>
  <text x="395" y="209" fill="#F5F3FF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Security-aware organization</text>
  <text x="1125" y="175" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 · EXECUTION</text>
  <text x="1125" y="209" fill="#ECFEFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">DeepSeek agent roles</text>

  <g fill="#223148" stroke="#64748B" stroke-width="1.5">
    <rect x="75" y="235" width="230" height="70" rx="15"/>
    <rect x="75" y="335" width="230" height="70" rx="15"/>
    <rect x="75" y="435" width="230" height="70" rx="15"/>
    <rect x="75" y="535" width="230" height="70" rx="15"/>
  </g>
  <g fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="190" y="278">Fixed scenarios</text>
    <text x="190" y="378">Simulated apps + tools</text>
    <text x="190" y="478">Dynamic events</text>
    <text x="190" y="578">Official validator</text>
  </g>
  <text x="190" y="647" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">ScenarioRunner · AgentBuilder</text>

  <g fill="#34245B" stroke="#A78BFA" stroke-width="1.7">
    <rect x="395" y="235" width="200" height="78" rx="15"/>
    <rect x="620" y="235" width="200" height="78" rx="15"/>
    <rect x="845" y="235" width="190" height="78" rx="15"/>
    <rect x="725" y="345" width="310" height="78" rx="15"/>
  </g>
  <rect x="395" y="345" width="310" height="78" rx="15" fill="#49351E" stroke="#FBBF24" stroke-width="1.7"/>
  <g fill="#F5F3FF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="495" y="269">Task</text><text x="495" y="294">Analyzer</text>
    <text x="720" y="269">Topology</text><text x="720" y="294">Planner</text>
    <text x="940" y="269">Organization</text><text x="940" y="294">Selector</text>
    <text x="880" y="378">Safe Reconfiguration</text>
    <text x="880" y="402" fill="#C4B5FD" font-size="15" font-weight="400">team · edges · visibility · isolation</text>
  </g>
  <text x="550" y="378" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Provenance + rule monitor</text>
  <text x="550" y="402" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="15">observed inputs · low-trust labels</text>
  <rect x="395" y="450" width="325" height="74" rx="15" fill="#28324B" stroke="#64748B" stroke-width="1.5"/>
  <text x="557" y="479" text-anchor="middle" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">MANTA topology structures</text>
  <text x="557" y="503" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">Spec · ContextPolicy · Mutation</text>
  <rect x="740" y="450" width="295" height="74" rx="15" fill="#49351E" stroke="#FBBF24" stroke-width="1.7"/>
  <text x="887" y="480" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Message Gateway</text>
  <text x="887" y="503" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="14">route · version · quarantine</text>
  <rect x="395" y="550" width="325" height="74" rx="15" fill="#28324B" stroke="#64748B" stroke-width="1.5"/>
  <text x="557" y="580" text-anchor="middle" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Controller state</text>
  <text x="557" y="603" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">version · permissions · phase</text>
  <rect x="740" y="550" width="295" height="74" rx="15" fill="#49351E" stroke="#FBBF24" stroke-width="1.7"/>
  <text x="887" y="580" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Tool Gateway</text>
  <text x="887" y="603" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="14">role · resource · exact write grant</text>
  <text x="700" y="657" text-anchor="middle" fill="#B7AED5" font-family="Arial, Helvetica, sans-serif" font-size="15">Candidate scoring uses task benefit, cost, and a limited risk proxy.</text>

  <g fill="#103A49" stroke="#22D3EE" stroke-width="1.8">
    <rect x="1125" y="235" width="240" height="70" rx="15"/>
    <rect x="1125" y="335" width="240" height="70" rx="15"/>
    <rect x="1125" y="435" width="240" height="70" rx="15"/>
    <rect x="1125" y="535" width="240" height="70" rx="15"/>
  </g>
  <g fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="1245" y="278">Coordinator</text>
    <text x="1245" y="378">Worker A · read-only</text>
    <text x="1245" y="478">Worker B · read-only</text>
    <text x="1245" y="578">Verifier</text>
  </g>
  <text x="1245" y="647" text-anchor="middle" fill="#A5DDE8" font-family="Arial, Helvetica, sans-serif" font-size="15">Multi-role path: online validation pending</text>

  <!-- Boundary arrows encode observed data, deterministic control, and guarded requests. -->
