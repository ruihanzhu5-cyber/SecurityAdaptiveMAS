  <circle cx="1136" cy="763" r="6" fill="#0891B2"/><text x="1150" y="769" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">任务执行</text>
  <circle cx="1260" cy="763" r="6" fill="#D97706"/><text x="1274" y="769" fill="#475569" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">安全检查</text>
