<svg xmlns="http://www.w3.org/2000/svg" width="480" height="611" viewBox="0 0 480 611" role="img" aria-labelledby="title desc">
  <title id="title">移动端三图模型：任务依赖、执行拓扑与历史来源</title>
  <desc id="desc">三种拟议图语义按纵向排列，汇入下一阶段拓扑选择；这些不是已完成的软件模块。</desc>
  <rect x="1" y="1" width="478" height="609" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="21" y="43" fill="#0F172A" font-size="27" font-weight="700">三种图，三种不同的问题</text>
    <text x="22" y="70" fill="#475569" font-size="16">任务需求、当前关系与历史来源</text>

    <rect x="21" y="93" width="438" height="119" rx="11" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="21" y="93" width="7" height="119" rx="3" fill="#4F46E5"/>
    <text x="45" y="130" fill="#4338CA" font-size="27" font-weight="700">D<tspan baseline-shift="sub" font-size="18">t</tspan></text>
    <text x="98" y="129" fill="#0F172A" font-size="21" font-weight="700">任务依赖</text>
    <text x="45" y="164" fill="#475569" font-size="16">子任务、先后顺序、并行机会</text>
    <text x="45" y="191" fill="#4338CA" font-size="15">为什么需要这条协作边？</text>

    <rect x="21" y="226" width="438" height="119" rx="11" fill="#FFFFFF" stroke="#7DD3C7" stroke-width="1.5"/>
    <rect x="21" y="226" width="7" height="119" rx="3" fill="#0F766E"/>
    <text x="45" y="263" fill="#0F766E" font-size="27" font-weight="700">G<tspan baseline-shift="sub" font-size="18">t</tspan></text>
    <text x="98" y="262" fill="#0F172A" font-size="21" font-weight="700">执行拓扑</text>
    <text x="45" y="297" fill="#475569" font-size="16">Agent、消息、Memory 与工具</text>
    <text x="45" y="324" fill="#0F766E" font-size="15">谁可以影响谁、执行什么？</text>

    <rect x="21" y="359" width="438" height="119" rx="11" fill="#FFFFFF" stroke="#F3C087" stroke-width="1.5"/>
    <rect x="21" y="359" width="7" height="119" rx="3" fill="#D97706"/>
    <text x="45" y="396" fill="#B45309" font-size="27" font-weight="700">H<tspan baseline-shift="sub" font-size="18">t</tspan></text>
    <text x="98" y="395" fill="#0F172A" font-size="21" font-weight="700">历史来源</text>
    <text x="45" y="430" fill="#475569" font-size="16">读取、摘要、消息和 Memory</text>
    <text x="45" y="457" fill="#9A3412" font-size="15">当前状态可能来自哪里？</text>

    <path d="M 240 479 L 240 496" stroke="#64748B" stroke-width="2.5"/>
    <path d="M 235 489 L 240 497 L 245 489" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21" y="501" width="438" height="77" rx="11" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <text x="43" y="534" fill="#312E81" font-size="19" font-weight="700">拟议 Controller：选择下一阶段拓扑</text>
    <text x="43" y="560" fill="#475569" font-size="15">比较任务收益、历史路径与重组成本</text>
    <text x="22" y="598" fill="#64748B" font-size="13">图中关系尚在建模，不表示代码已实现。</text>
  </g>
</svg>
