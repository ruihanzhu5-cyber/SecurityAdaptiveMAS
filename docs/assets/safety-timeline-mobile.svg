<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
  <title id="title">移动端 T1 到 T5 全过程安全时间线</title>
  <desc id="desc">五个拟议干预时点按纵向排列，各有目标与限制，不代表已实现的防御流水线。</desc>
  <rect x="1" y="1" width="478" height="648" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="21" y="40" fill="#0F172A" font-size="27" font-weight="700">全过程安全：T1–T5</text>
    <text x="22" y="67" fill="#475569" font-size="16">不同时间，处理不同问题</text>
    <path d="M 37 120 L 37 562" stroke="#CBD5E1" stroke-width="3"/>

    <rect x="60" y="87" width="399" height="97" rx="11" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="37" cy="135" r="11" fill="#4F46E5"/>
    <text x="79" y="116" fill="#4338CA" font-size="16" font-weight="700">T1 · PREVENTION</text>
    <text x="79" y="143" fill="#0F172A" font-size="19" font-weight="700">接触前限制不必要的暴露</text>
    <text x="79" y="168" fill="#475569" font-size="14">未知攻击不能全部预知。</text>

    <rect x="60" y="198" width="399" height="97" rx="11" fill="#FFFFFF" stroke="#99DED4"/>
    <circle cx="37" cy="246" r="11" fill="#0F766E"/>
    <text x="79" y="227" fill="#0F766E" font-size="16" font-weight="700">T2 · CONTAINMENT</text>
    <text x="79" y="254" fill="#0F172A" font-size="19" font-weight="700">接触后限制进一步传播</text>
    <text x="79" y="279" fill="#475569" font-size="14">接触不等于已被控制。</text>

    <rect x="60" y="309" width="399" height="97" rx="11" fill="#FFFFFF" stroke="#F1C48A"/>
    <circle cx="37" cy="357" r="11" fill="#D97706"/>
    <text x="79" y="338" fill="#9A3412" font-size="16" font-weight="700">T3 · RECOVERY</text>
    <text x="79" y="365" fill="#0F172A" font-size="19" font-weight="700">核验或重算历史状态</text>
    <text x="79" y="390" fill="#475569" font-size="14">断边不能清除旧 Memory。</text>

    <rect x="60" y="420" width="399" height="97" rx="11" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="37" cy="468" r="11" fill="#4338CA"/>
    <text x="79" y="449" fill="#4338CA" font-size="16" font-weight="700">T4 · BOUNDARY</text>
    <text x="79" y="476" fill="#0F172A" font-size="19" font-weight="700">敏感动作前核对授权</text>
    <text x="79" y="501" fill="#475569" font-size="14">拓扑不能代替 Tool Gateway。</text>

    <rect x="60" y="531" width="399" height="97" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="37" cy="579" r="11" fill="#475569"/>
    <text x="79" y="560" fill="#475569" font-size="16" font-weight="700">T5 · FINAL STATE</text>
    <text x="79" y="587" fill="#0F172A" font-size="19" font-weight="700">检查持久状态与遗留能力</text>
    <text x="79" y="612" fill="#475569" font-size="14">事后改图无法撤销已发生的损害。</text>
    <text x="22" y="640" fill="#64748B" font-size="12">拟议干预目标，不表示已实现的流水线。</text>
  </g>
</svg>
